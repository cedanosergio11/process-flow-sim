name: restore-package-lock
on:
  push:
    paths:
      - '.github/workflows/restore-package-lock.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble hex parts 16-18 and decode lockfile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, gzip, subprocess, os

          hex_dir = Path('.github/restore-payloads/lock-hex')
          out_dir = Path('.github/restore-payloads')
          expect_sha = {
            16: '297fc4ac47c0d97cb965804686398ec1d99e8a4e',
            17: '602d9ac6f378af42fa8e9e65d8262d252c61b1c5',
            18: '6450b836063baaf0c650b24be805c44f404d42f1',
          }
          expect_len = {16: 4000, 17: 4000, 18: 2884}
          counts = {16: 20, 17: 20, 18: 15}

          for part, n in counts.items():
              hx = ''.join((hex_dir / f'p{part:02d}_{k:02d}.hex').read_text().strip() for k in range(n))
              data = bytes.fromhex(hx)
              assert len(data) == expect_len[part], (part, len(data))
              path = out_dir / f'package-lock.json.gz.b64.{part:02d}'
              path.write_bytes(data)
              sha = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              assert sha == expect_sha[part], (part, sha, expect_sha[part])
              print(f'assembled part {part:02d} OK {sha}')

          parts = []
          for i in range(19):
              p = out_dir / f'package-lock.json.gz.b64.{i:02d}'
              parts.append(p.read_bytes())
          b64 = b''.join(parts)
          # strip whitespace just in case
          b64 = b''.join(b64.split())
          import base64
          raw = base64.b64decode(b64)
          lock = gzip.decompress(raw)
          Path('package-lock.json').write_bytes(lock)
          md5 = hashlib.md5(lock).hexdigest()
          print('lock bytes', len(lock), 'md5', md5)
          assert len(lock) == 265949, len(lock)
          assert md5 == '9f9d37e731d50cbe4014490eef216016', md5
          sha = subprocess.check_output(['git', 'hash-object', 'package-lock.json'], text=True).strip()
          print('lock git sha', sha)
          assert sha == '454aee32469030b78486718d27bc61f0ee29e29c', sha
          print('package-lock.json verified')
          PY
      - name: Commit lockfile and cleanup payloads
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm -r .github/restore-payloads || true
          git rm .github/workflows/restore-package-lock.yml
          git commit -m 'chore: restore package-lock.json from gzip+base64 payloads'
          git push
