name: fix-lock-part03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lock-part03.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix known typos in part 03
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('.github/restore-payloads/package-lock.json.gz.b64.03')
          t = p.read_text()
          # Expected local md5 for correct part03
          expect_md5 = '13baeaa02914b909dfea417b0d43fce1'
          # Apply known corruptions if present
          t2 = t.replace('vl2LS4+9xojTsi517i', 'vl2Us4+9xojTsi517i', 1)
          t2 = t2.replace('sr2Xa53NnP1AXqsT6m1S', 'sr2Xa93NnP1AXqsT6m1S', 1)
          p.write_text(t2)
          import hashlib as H
          md5 = H.md5(t2.encode()).hexdigest()
          print('md5', md5)
          assert md5 == expect_md5, md5
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/restore-payloads/package-lock.json.gz.b64.03
          git commit -m "ci: fix package-lock gzip payload part 03" || echo nochange
          git rm -f .github/workflows/fix-lock-part03.yml
          git commit -m "ci: remove fix-lock-part03 workflow" || true
          git push
