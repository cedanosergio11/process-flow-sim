name: restore-remain-files
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/restore-payloads/remain-files.json.gz.b64.*"
      - ".github/workflows/restore-remain-files.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write files
        run: |
          node <<'JS'
          const fs = require("fs");
          const zlib = require("zlib");
          const crypto = require("crypto");
          const path = require("path");
          const parts = [".github/restore-payloads/remain-files.json.gz.b64.00", ".github/restore-payloads/remain-files.json.gz.b64.01", ".github/restore-payloads/remain-files.json.gz.b64.02", ".github/restore-payloads/remain-files.json.gz.b64.03", ".github/restore-payloads/remain-files.json.gz.b64.04", ".github/restore-payloads/remain-files.json.gz.b64.05", ".github/restore-payloads/remain-files.json.gz.b64.06", ".github/restore-payloads/remain-files.json.gz.b64.07", ".github/restore-payloads/remain-files.json.gz.b64.08", ".github/restore-payloads/remain-files.json.gz.b64.09", ".github/restore-payloads/remain-files.json.gz.b64.10", ".github/restore-payloads/remain-files.json.gz.b64.11", ".github/restore-payloads/remain-files.json.gz.b64.12", ".github/restore-payloads/remain-files.json.gz.b64.13", ".github/restore-payloads/remain-files.json.gz.b64.14", ".github/restore-payloads/remain-files.json.gz.b64.15", ".github/restore-payloads/remain-files.json.gz.b64.16", ".github/restore-payloads/remain-files.json.gz.b64.17", ".github/restore-payloads/remain-files.json.gz.b64.18", ".github/restore-payloads/remain-files.json.gz.b64.19", ".github/restore-payloads/remain-files.json.gz.b64.20", ".github/restore-payloads/remain-files.json.gz.b64.21", ".github/restore-payloads/remain-files.json.gz.b64.22", ".github/restore-payloads/remain-files.json.gz.b64.23", ".github/restore-payloads/remain-files.json.gz.b64.24", ".github/restore-payloads/remain-files.json.gz.b64.25", ".github/restore-payloads/remain-files.json.gz.b64.26", ".github/restore-payloads/remain-files.json.gz.b64.27"];
          const expectedMd5 = "cb91f4c09f6937d7f18ecb45193da476";
          const expectedLen = 301139;
          if (!parts.every((p) => fs.existsSync(p))) {
            console.log("incomplete payload parts — skip");
            process.exit(0);
          }
          const b64 = parts.map((p) => fs.readFileSync(p, "utf8").trim()).join("");
          const raw = zlib.gunzipSync(Buffer.from(b64, "base64"));
          const md5 = crypto.createHash("md5").update(raw).digest("hex");
          if (raw.length !== expectedLen || md5 !== expectedMd5) {
            throw new Error(`bad payload len=${raw.length} md5=${md5}`);
          }
          const map = JSON.parse(raw.toString("utf8"));
          let n = 0;
          for (const [rel, content] of Object.entries(map)) {
            fs.mkdirSync(path.dirname(rel), { recursive: true });
            fs.writeFileSync(rel, content, "utf8");
            console.log("wrote", rel, Buffer.byteLength(content, "utf8"));
            n++;
          }
          console.log("restored", n, "files");
          JS
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Do not commit helper payloads/workflow in the restore commit
          git reset HEAD -- .github/restore-payloads .github/workflows/restore-remain-files.yml || true
          if git diff --cached --quiet; then
            echo "no restored changes"
          else
            git commit -m "chore: restore remaining process-flow-sim source files"
            git push
          fi
      - name: Remove helper workflow and payloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf .github/restore-payloads .github/workflows/restore-remain-files.yml || true
          if git diff --cached --quiet; then
            echo "no helpers to remove"
          else
            git commit -m "chore: remove remain-files restore helper workflow and payloads"
            git push
          fi
