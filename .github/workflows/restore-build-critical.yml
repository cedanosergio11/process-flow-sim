name: restore-build-critical
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode payloads to exact files
        run: |
          node <<'JS'
          const fs = require("fs");
          const zlib = require("zlib");
          const crypto = require("crypto");
          const targets = [
            {
              path: "scripts/grok-pwa-shared.mjs",
              parts: ["scripts/grok-pwa-shared.mjs.gz.b64.0", "scripts/grok-pwa-shared.mjs.gz.b64.1"],
              len: 17665,
              md5: "53e4f6d4ef4cea9c1b6258585745390e",
            },
            {
              path: "src/components/pid/equipment.tsx",
              parts: ["src/components/pid/equipment.tsx.gz.b64"],
              len: 14422,
              md5: "0a261150a3bd031163ab9860eac2130c",
            },
            {
              path: "src/components/pid/symbols.tsx",
              parts: ["src/components/pid/symbols.tsx.gz.b64"],
              len: 22269,
              md5: "71cef28c679e2947c9e9ea45fccf9c12",
            },
            {
              path: "src/components/pid/schematic.tsx",
              parts: ["src/components/pid/schematic.tsx.gz.b64.0", "src/components/pid/schematic.tsx.gz.b64.1"],
              len: 28176,
              md5: "e117a60535d03cdb98cfbbd1139423a8",
            },
          ];
          for (const t of targets) {
            if (!t.parts.every((p) => fs.existsSync(p))) {
              console.log("skip missing", t.path);
              continue;
            }
            const b64 = t.parts.map((p) => fs.readFileSync(p, "utf8").trim()).join("");
            const code = zlib.gunzipSync(Buffer.from(b64, "base64")).toString("utf8");
            const md5 = crypto.createHash("md5").update(code).digest("hex");
            if (code.length !== t.len || md5 !== t.md5) {
              throw new Error(`bad ${t.path} len=${code.length} md5=${md5}`);
            }
            fs.writeFileSync(t.path, code);
            console.log("ok", t.path, code.length, md5);
          }
          JS
      - name: Commit restored files
        run: |
          git config user.name "cedanosergio11"
          git config user.email "cedanosergio11@gmail.com"
          git add scripts/grok-pwa-shared.mjs src/components/pid/equipment.tsx src/components/pid/symbols.tsx src/components/pid/schematic.tsx || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "feat(pid): ISA bubbles, flow chevrons, line-class tags, drawing legend (Cate)"
            git push
          fi
