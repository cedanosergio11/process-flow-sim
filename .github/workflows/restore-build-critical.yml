name: restore-build-critical
on:
  workflow_dispatch:
  push:
    paths:
      - "src/components/pid/symbols.tsx.gz.b64"
      - "src/components/pid/schematic.tsx.gz.b64.*"
      - ".github/workflows/restore-build-critical.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode pid UI payloads (v1.4.4.0 perf)
        run: |
          node <<'JS'
          const fs = require("fs");
          const zlib = require("zlib");
          const crypto = require("crypto");
          const targets = [{"path": "src/components/pid/symbols.tsx", "parts": ["src/components/pid/symbols.tsx.gz.b64"], "len": 22334, "md5": "ccf59cac9a0ab655ecdb2e560c859d9c"}, {"path": "src/components/pid/schematic.tsx", "parts": ["src/components/pid/schematic.tsx.gz.b64.0", "src/components/pid/schematic.tsx.gz.b64.1", "src/components/pid/schematic.tsx.gz.b64.2", "src/components/pid/schematic.tsx.gz.b64.3", "src/components/pid/schematic.tsx.gz.b64.4", "src/components/pid/schematic.tsx.gz.b64.5", "src/components/pid/schematic.tsx.gz.b64.6"], "len": 28349, "md5": "3911ca5b3d76a3173ceab8f609d14726"}];
          for (const t of targets) {
            if (!t.parts.every((p) => fs.existsSync(p))) {
              console.log("skip missing", t.path);
              continue;
            }
            const b64 = t.parts.map((p) => fs.readFileSync(p, "utf8").trim()).join("");
            const code = zlib.gunzipSync(Buffer.from(b64, "base64")).toString("utf8");
            const md5 = crypto.createHash("md5").update(code).digest("hex");
            if (code.length !== t.len || md5 !== t.md5) {
              throw new Error(`bad ${t.path} len=${code.length} md5=${md5}`);
            }
            fs.writeFileSync(t.path, code);
            console.log("ok", t.path, code.length, md5);
          }
          JS
      - name: Commit restored files
        run: |
          git config user.name "cedanosergio11"
          git config user.email "cedanosergio11@gmail.com"
          git add src/components/pid/symbols.tsx src/components/pid/schematic.tsx
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "perf(pid): memo Pipe/Tee/Hose + pumpOnBits schematic (v1.4.4.0)"
            git push
          fi
