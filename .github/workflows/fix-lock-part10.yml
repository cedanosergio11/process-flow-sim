name: fix-lock-part10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lock-part10.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Qiny->Qivy typo in part 10
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('.github/restore-payloads/package-lock.json.gz.b64.10')
          t = p.read_text()
          t2 = t.replace('Lx91MpX6QinyEC+8V7gE', 'Lx91MpX6QivyEC+8V7gE', 1)
          assert t2 != t, 'pattern not found'
          p.write_text(t2)
          md5 = hashlib.md5(t2.encode()).hexdigest()
          print('md5', md5)
          assert md5 == '52a56b6e5326387f0fc4e31592dbc655', md5
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/restore-payloads/package-lock.json.gz.b64.10
          git commit -m "ci: fix package-lock gzip payload part 10"
          git rm -f .github/workflows/fix-lock-part10.yml
          git commit -m "ci: remove fix-lock-part10 workflow"
          git push
