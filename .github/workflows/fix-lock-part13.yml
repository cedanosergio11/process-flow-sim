name: fix-lock-part13
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lock-part13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix known typos in part 13
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('.github/restore-payloads/package-lock.json.gz.b64.13')
          t = p.read_text()
          reps = [
            ('htjrvYNNnao4gLv1Y2V2', 'htjrvYNNtao4gLv1Y2V2'),
            ('rxV+D9LSQNqDkga6g+at', 'rxV+D9UsQNqDkga6g+at'),
            ('569s078jzTt7aPe6trb/', '569s078pzTt7aPe6trb/'),
          ]
          for a,b in reps:
            assert a in t, a
            t = t.replace(a, b, 1)
          p.write_text(t)
          md5 = hashlib.md5(t.encode()).hexdigest()
          print('md5', md5)
          assert md5 == 'd45d4fe2425cc280d34aaae34b9d168a', md5
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/restore-payloads/package-lock.json.gz.b64.13
          git commit -m "ci: fix package-lock gzip payload part 13"
          git rm -f .github/workflows/fix-lock-part13.yml
          git commit -m "ci: remove fix-lock-part13 workflow"
          git push
